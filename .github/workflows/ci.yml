name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,azure]"
      - run: ruff check .
      - run: ruff format --check .
      # Dagster reads the dbt manifest when the definitions are imported.
      - run: dbt parse --project-dir dbt_project --profiles-dir dbt_project
      - run: pytest -q

  demo-data:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # Dagster reads the dbt manifest when the definitions are imported.
      - run: dbt parse --project-dir dbt_project --profiles-dir dbt_project
      - run: python -m generator.generate
      - run: dagster job execute -m orchestration.definitions -j daily_pipeline
      - run: python -m pipeline.check
      - name: Publish the warehouse as release asset (the dashboard downloads it)
        run: |
          gh release view demo-data >/dev/null 2>&1 || gh release create demo-data \
            --title "Demo data" --latest=false \
            --notes "Warehouse built by CI on every push to main; the dashboard downloads it."
          gh release upload demo-data data/warehouse.duckdb --clobber

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t retail-data-pipeline:ci .
      - name: Run the daily job in the container and check the result
        run: >
          docker run --rm retail-data-pipeline:ci
          sh -c "dagster job execute -m orchestration.definitions -j daily_pipeline
          && python -m pipeline.check"

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test, docker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
