name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t retail-data-pipeline:ci .
      - name: Run the daily job in the container and check the result
        run: >
          docker run --rm retail-data-pipeline:ci
          sh -c "dagster job execute -m orchestration.definitions -j daily_pipeline
          && python -m pipeline.check"
