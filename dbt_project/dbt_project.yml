name: retail
version: "1.0.0"
profile: retail
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

seeds:
  retail:
    +schema: reference
    calendar_events:
      +column_types:
        start_date: date
        end_date: date

models:
  retail:
    staging:
      +schema: staging
      +materialized: view
    quality:
      +schema: quality
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

vars:
  # Reorder assumptions in days, used by marts/rec_reorder.sql
  supplier_lead_time_days: 10
  safety_stock_days: 7
  order_cover_days: 28
